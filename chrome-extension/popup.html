<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Meeting Assistant</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 300px;
    background: #0d0f14;
    color: #e8eaf6;
    font-family: 'Segoe UI', sans-serif;
    font-size: 13px;
  }

  .header {
    background: #13161e;
    padding: 14px 16px;
    border-bottom: 1px solid #252836;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .dot { 
    width: 10px; height: 10px; 
    border-radius: 50%; 
    background: #6c63ff;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  h1 { font-size: 14px; font-weight: 600; }

  .badge {
    margin-left: auto;
    background: #1a1e2a;
    color: #00d4aa;
    font-size: 9px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }

  .content { padding: 12px 16px; }

  .status-card {
    background: #13161e;
    border: 1px solid #252836;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .status-row:last-child { margin-bottom: 0; }

  .indicator {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .green { background: #00d4aa; }
  .orange { background: #f6ad55; }
  .gray { background: #4a5568; }
  .red { background: #fc8181; }

  .status-text { color: #8892b0; font-size: 11px; }
  .status-value { color: #e8eaf6; font-size: 11px; margin-left: auto; }

  .btn {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 6px;
    font-family: 'Segoe UI', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 6px;
    transition: all 0.15s;
  }

  .btn-primary { background: #6c63ff; color: white; }
  .btn-primary:hover { background: #8b84ff; }
  .btn-secondary { background: #1a1e2a; color: #8892b0; }
  .btn-secondary:hover { background: #252836; color: #e8eaf6; }

  .ask-input {
    width: 100%;
    background: #1e2330;
    border: 1px solid #252836;
    border-radius: 6px;
    color: #e8eaf6;
    font-family: 'Segoe UI', sans-serif;
    font-size: 11px;
    padding: 8px 10px;
    margin-bottom: 6px;
    outline: none;
    resize: none;
  }

  .ask-input::placeholder { color: #4a5568; }
  .ask-input:focus { border-color: #6c63ff; }

  .answer-box {
    background: #13161e;
    border: 1px solid #252836;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 11px;
    color: #e8eaf6;
    max-height: 120px;
    overflow-y: auto;
    line-height: 1.5;
    display: none;
  }

  .answer-box.visible { display: block; }

  .section-title {
    color: #4a5568;
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .footer {
    background: #13161e;
    border-top: 1px solid #252836;
    padding: 8px 16px;
    color: #4a5568;
    font-size: 9px;
    text-align: center;
  }

  a { color: #6c63ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="header">
  <div class="dot"></div>
  <h1>AI Meeting Assistant</h1>
  <div class="badge">🛡 STEALTH</div>
</div>

<div class="content">

  <!-- Status -->
  <div class="section-title">Status</div>
  <div class="status-card">
    <div class="status-row">
      <div class="indicator" id="backend-dot"></div>
      <span class="status-text">Backend</span>
      <span class="status-value" id="backend-status">Checking...</span>
    </div>
    <div class="status-row">
      <div class="indicator" id="api-dot"></div>
      <span class="status-text">Gemini API</span>
      <span class="status-value" id="api-status">Unknown</span>
    </div>
    <div class="status-row">
      <div class="indicator" id="meeting-dot" class="indicator gray"></div>
      <span class="status-text">Meeting</span>
      <span class="status-value" id="meeting-status">Not detected</span>
    </div>
  </div>

  <!-- Quick Ask -->
  <div class="section-title" style="margin-top: 12px;">Quick Ask</div>
  <textarea class="ask-input" id="quick-question" rows="2" placeholder="Ask the AI anything..."></textarea>
  <button class="btn btn-primary" id="ask-btn">✨ Ask AI</button>
  <div class="answer-box" id="answer-box"></div>

  <!-- Actions -->
  <div class="section-title" style="margin-top: 12px;">Actions</div>
  <button class="btn btn-secondary" id="summarize-btn">📋 Summarize Meeting</button>
  <button class="btn btn-secondary" id="action-items-btn">✅ Get Action Items</button>

</div>

<div class="footer">
  Overlay hotkey: <strong>Ctrl+Shift+Space</strong> &nbsp;|&nbsp;
  <a href="https://aistudio.google.com" target="_blank">Get API Key (Free)</a>
</div>

<script src="popup.js"></script>
</body>
</html>
